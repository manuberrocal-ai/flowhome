name: Trends Monitor
on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
jobs:
  trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run discover:products
      - run: echo "Trends API integration is placeholder until a free/approved provider key is available."
