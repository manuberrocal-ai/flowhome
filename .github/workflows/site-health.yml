name: FlowHome public site health

on:
  schedule:
    # 13:17 UTC / 10:17 Buenos Aires. This observes the site, not the agent goal.
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flowhome-public-site-health
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      github.repository == 'manuberrocal-ai/flowhome' &&
      github.ref == 'refs/heads/main' &&
      vars.FLOWHOME_HEALTH_KILL_SWITCH != 'true' &&
      (github.event_name == 'workflow_dispatch' || vars.FLOWHOME_HEALTH_SCHEDULE_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Observe three public HTML sentinels
        run: node scripts/qa/site-health.mjs https://flowhome.dev > "$RUNNER_TEMP/site-health.json"
      - name: Preserve observation on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flowhome-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site-health.json
          if-no-files-found: error
          retention-days: 14
