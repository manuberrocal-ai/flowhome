compatibilityNotes:
  - "MS-S02 is the Zigbee Motion Sensor P1, not the Thread-based P2 or a presence sensor. The manufacturer's setup requires an Aqara Zigbee 3.0 hub and Aqara Home app; an individual ecosystem pairing is not certified here."
  - "The previous ASIN could not be substantiated; this destination identifies MS-S02 in the consulted listing. Historical commercial observations have not been verified for the corrected destination. Confirm hardware, firmware and seller package before buying."
installation:
  model: "MS-S02"
  market: US
  assessment: light-setup
  requirements:
    - "Have an Aqara Zigbee 3.0 hub and Aqara Home app ready. Remove the battery insulating tab, add Motion Sensor P1 in the app and confirm communication with the hub before fixing the sensor in position."
    - "Use indoors, away from moisture and heat sources. Choose a clean, flat mounting surface and a detection direction; the manual recommends 1.2-2 m mounting height. Avoid glass, tile, marble, uneven wall coverings and facing heaters. Test detection at the intended location."
    - "Follow the MS-S02 manual for its two CR2450 button batteries; keep new and used batteries away from children and stop using a compartment that will not close securely. This is a documentary setup assessment, not a tested security system or a guarantee of ecosystem pairing."
