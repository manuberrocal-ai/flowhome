intro: "This shortlist is organized around installation decisions, not a guarantee of lease compliance or damage-free removal. Get any required property permission, inspect the actual mounting method, and plan how the original setup will be restored."
buyingConsiderations:
  - label: "Check the physical change"
    detail: "August documents a retrofit that retains existing exterior deadbolt hardware and keys, but that does not waive property rules or establish door compatibility. For adhesive lighting and camera mounts, check the surface and removal instructions."
  - label: "Confirm the exact device"
    detail: "This catalog identifies the Kasa EP10P2 two-pack and Govee H617C, not every Mini or RGBIC variant. H617C is a 10 m Bluetooth strip marked not cuttable; do not plan to shorten it to fit a rental. Confirm plug load limits, mounting surface, control method, and included power hardware using the exact model documentation and seller package."
