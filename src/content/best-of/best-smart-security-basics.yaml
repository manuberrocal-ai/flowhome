intro: "The devices serve different roles and have not been tested here as a combined security system. A camera or connected lock is not a guarantee against intrusion. Plan the event you need to observe or the access you need to manage."
buyingConsiderations:
  - label: "Location and recording"
    detail: "eufy documents C120 as non-waterproof indoor equipment, while Blink Outdoor 4 has a battery and Sync Module workflow. Confirm the recording destination, subscription feature boundaries, and permissions of people who share the space."
  - label: "Doorway and lock requirements"
    detail: "Ring's original Wired does not drive an existing in-home chime. August's retrofit requires a compatible deadbolt. Confirm the exact regional hardware and installation instructions; this shortlist is not an installation or security certification."
