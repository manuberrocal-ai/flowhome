    detail: "Roborock documents PreciSense Precision LiDAR for Q5+. iRobot documents PrecisionVision and Imprint Smart Mapping for j7+. Compare these approaches against the home's layout; feature names do not prove a performance advantage."
  - label: "Cleaning type and generation"
    detail: "The original models discussed here are vacuum-only. Do not transfer specifications from similarly named Q5 Pro or Roomba Combo products. Confirm the original model and included emptying dock."
