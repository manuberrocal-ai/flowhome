intro: "These are separate product candidates, not a tested bundle or a fixed-budget kit. Start with one useful room routine and confirm every device and accessory required to complete it."
buyingConsiderations:
  - label: "Choose the control method"
    detail: "Echo Dot uses the Alexa app for setup; Kasa requires model selection in its setup flow. Hue's Bridge-connected approach is different from direct Wi-Fi bulbs. Confirm which path fits the room and household controls."
  - label: "Avoid assuming a complete bundle"
    detail: "Verify Hue bulb generation and included Bridge, and the original Ring Wired's power and chime requirements. Compare current total cost after required accessories and any installation work; no historical catalog amount guarantees a complete setup."
