intro: "This is a role-based documentary shortlist, not a compatibility certification or price ranking. Identify the actual accessories and desired actions before selecting a hub."
buyingConsiderations:
  - label: "Power, package, and setup differences"
    detail: "The M2 manual specifies a separately purchased power adapter; Ethernet does not replace USB power. Hub 2 needs its sensor-equipped USB-C cable, not an ordinary substitute. Aeotec recommends Ethernet for initial setup and requires SmartThings registration with a Samsung account. Check each model's installation documentation and current seller package."
  - label: "Identity before ecosystem logos"
    detail: "This catalog documents Aeotec GP-AEOHUBV3US, not Smart Home Hub 2; regional Z-Wave radios differ. Manufacturer setup sources for M2 and SwitchBot Hub 2 establish the model family but do not independently match their catalog Amazon ASINs. Check the linked product profiles for identity evidence and unknowns before following a retailer link."
  - label: "Matter and Zigbee support"
    detail: "Aqara documents a Matter bridge path for supported M2-connected Zigbee accessories. SwitchBot Hub 2 bridges supported SwitchBot and infrared devices. Aeotec documents a SmartThings controller. A Matter label does not make these roles interchangeable."
  - label: "Platform and firmware requirements"
    detail: "Confirm the receiving platform, controller requirements, hub generation, region, firmware, and exact accessory functions. The M2 firmware announcement is historical; it does not validate firmware installed on a unit today."
  - label: "Current buying cost"
    detail: "Compare current seller terms, required controllers or accessories, and migration work. Prices and ratings have not been verified for this guide; historical catalog values do not establish a cheapest option."
