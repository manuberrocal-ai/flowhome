intro: "Choose the fixture or mounting location before the ecosystem. This documentary guide compares formats and selected manufacturer guidance; it does not verify every seller model, current price, or comparative lighting performance."
buyingConsiderations:
  - label: "Bulb or strip installation"
    detail: "The catalog identifies Hue kit 562918 with two E26 color bulbs and a Bridge, Wyze Bulb Color, and Govee H617C. H617C is a 10 m strip that Govee marks as not cuttable. Confirm sockets, seller package, mounting surface, and included power hardware; exact firmware and pairings are not verified."
  - label: "Wall-switch and always-powered behavior"
    detail: "For app-operated Hue lighting, wall switches should usually stay on so the bulbs remain reachable. Hue documents controls that maintain bulb power. Use regional installation instructions and verify the behavior of any other brand separately."
  - label: "Ecosystem and app control"
    detail: "Wyze documents Alexa and Google Assistant control for Bulb Color. Govee lists H617C as Bluetooth-controlled, without Alexa or Matter support. Do not transfer Wi-Fi or assistant support from other RGBIC models to this strip."
  - label: "Color and dimming needs"
    detail: "Check whether the required control is color selection, brightness, tunable white, or an entire circuit. Bulbs and strips need different physical installations; their presence in one comparison does not establish equivalent output or quality."
  - label: "Current buying cost"
    detail: "Prices and ratings have not been verified for this guide. Compare current listing terms, required bridges, controllers, and replacement quantities before buying; historical catalog snapshots are not offers."
